name: CloudOps Website CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cloudops-website:test .

      - name: Start website container
        run: docker run -d --name cloudops-test -p 8081:80 cloudops-website:test

      - name: Test website response
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8081; then
              echo "Website test passed"
              exit 0
            fi
            sleep 2
          done
          echo "Website test failed"
          docker logs cloudops-test
          exit 1
